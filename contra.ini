; contra loader config (Contra: Evolution, AMContra.exe)
[general]
; clock_set=1 reports the clock as set (uses the PC clock), avoids boot error 5-2503
clock_set=1
debug=0

[keyboard]
; aN=<DirectInput DIK code> rebinds game action N (all its keyboard entries). Loader defaults:
;   a0=0x02 P1 start (1)      a1=0x03 P2 start (2)
;   a20=0x3c test (F2)        a21=0x3b service (F1)
;   P1 buttons: a12=0x12 (E) a14=0x13 (R) a10=0x14 (T)   a16 stays I
;   P2 buttons: a13=0x21 (F) a15=0x22 (G) a11=0x23 (H)   a17=0xc7 (Home)
; Game defaults kept: P1 move W/A/S/D (a2/a4/a6/a8), P2 move arrows (a3/a5/a7/a9)
; DIK: 1=0x02 2=0x03 E=0x12 R=0x13 T=0x14 F=0x21 G=0x22 H=0x23 F1=0x3b F2=0x3c Enter=0x1c Space=0x39 Home=0xc7

[keys]
; coin keys (Windows virtual-key codes): 5 = slot 1, 6 = slot 2. Sent as I/O board coin events.
coin1=0x35
coin2=0x36

[pad]
; XInput button masks for coins (0x20 = Back)
coin1=0x20
coin2=0x20
